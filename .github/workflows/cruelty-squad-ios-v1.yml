name: Cruelty Squad iOS - v1.9 GLES3 Angle Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Recover Godot project and build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90

    env:
      GODOT_VERSION: "3.5.3"
      GDRE_VERSION: "2.6.4"
      APP_NAME: "Cruelty Squad"
      BUNDLE_ID: "com.negel.crueltysquad"
      WORK: "${{ github.workspace }}/_cruelty_ios_v1_9"
      PROJECT: "${{ github.workspace }}/_cruelty_ios_v1_9/project"
      APK: "${{ github.workspace }}/_cruelty_ios_v1_9/Cruelty-Squad.apk"
      IOS_OUT: "${{ github.workspace }}/_cruelty_ios_v1_9/ios-out"
      IOS_ZIP: "${{ github.workspace }}/_cruelty_ios_v1_9/ios-out/CrueltySquad.zip"
      IPA: "${{ github.workspace }}/Cruelty-Squad-iOS-v1.9-unsigned.ipa"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          mkdir -p "$WORK" "$PROJECT" "$WORK/logs" "$WORK/icons"

      - name: Find Cruelty Squad APK automatically
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail

          echo "=== LOOK FOR APK IN CHECKED-OUT REPOSITORY ==="
          FOUND="$(find "$GITHUB_WORKSPACE" -type f -iname '*.apk' \
            ! -path "$WORK/*" -print -quit || true)"

          if [ -n "$FOUND" ]; then
            echo "Found APK in repository: $FOUND"

            # If Git LFS was used, make sure checkout gave us the real binary
            # and not a tiny LFS pointer text file.
            if head -c 200 "$FOUND" 2>/dev/null | grep -q 'git-lfs.github.com/spec'; then
              echo "APK is a Git LFS pointer. Pulling LFS content..."
              git lfs install --local || true
              git lfs pull
            fi

            cp "$FOUND" "$APK"
          else
            echo "No APK file in repository checkout."
            echo "=== LOOK FOR APK IN GITHUB RELEASES ==="

            mkdir -p "$WORK/release-apk"

            # Try latest release first.
            if gh release download \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.apk' \
              --dir "$WORK/release-apk" 2>/dev/null; then
              :
            else
              echo "Latest release had no APK. Searching all releases..."

              TAGS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' || true)"
              for TAG in $TAGS; do
                rm -rf "$WORK/release-apk"
                mkdir -p "$WORK/release-apk"

                if gh release download "$TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern '*.apk' \
                  --dir "$WORK/release-apk" 2>/dev/null; then
                  FOUND_RELEASE="$(find "$WORK/release-apk" -maxdepth 1 -type f -iname '*.apk' -print -quit || true)"
                  if [ -n "$FOUND_RELEASE" ]; then
                    echo "Found APK in release tag: $TAG"
                    break
                  fi
                fi
              done
            fi

            FOUND_RELEASE="$(find "$WORK/release-apk" -maxdepth 1 -type f -iname '*.apk' -print -quit || true)"
            if [ -n "$FOUND_RELEASE" ]; then
              cp "$FOUND_RELEASE" "$APK"
              echo "Downloaded APK from release: $FOUND_RELEASE"
            fi
          fi

          if [ ! -f "$APK" ]; then
            echo "::error::Could not find any APK in the repository or GitHub Releases."
            exit 1
          fi

          echo "APK candidate:"
          ls -lh "$APK"

          python3 - <<'PYCODE'
          import os, sys, zipfile
          apk = os.environ["APK"]

          try:
              with zipfile.ZipFile(apk) as z:
                  names = set(z.namelist())
                  required = {
                      "assets/project.binary",
                      "lib/arm64-v8a/libgodot_android.so",
                  }
                  missing = sorted(required - names)

                  if missing:
                      print("ERROR: APK was found, but it is not the expected Cruelty Squad Godot port.")
                      print("Missing:", *missing, sep="\n - ")
                      sys.exit(2)

                  print("APK ZIP OK")
                  print("project.binary: YES")
                  print("ARM64 Godot: YES")
                  print("GDScript bytecode files:", sum(n.endswith(".gdc") for n in names))
                  print("Scenes:", sum(n.endswith(".tscn") or n.endswith(".scn") for n in names))
          except zipfile.BadZipFile:
              print("ERROR: found .apk is not a valid APK/ZIP.")
              sys.exit(3)
          PYCODE

      - name: Confirm Godot version and mobile content
        shell: bash
        run: |
          set -euo pipefail

          unzip -p "$APK" lib/arm64-v8a/libgodot_android.so > "$WORK/libgodot_android.so"
          VERSION="$(strings "$WORK/libgodot_android.so" | grep -Eo '3\.5\.[0-9]+\.stable\.official' | head -n 1 || true)"
          echo "Detected Godot: ${VERSION:-unknown}" | tee "$WORK/logs/apk-summary.txt"

          if [ -n "$VERSION" ] && [[ "$VERSION" != 3.5.3* ]]; then
            echo "::warning::APK Godot version is $VERSION, workflow is prepared for Godot 3.5.3."
          fi

          {
            echo
            echo "ARM libraries:"
            unzip -Z1 "$APK" | grep '^lib/' | sort || true
            echo
            echo "Touch controls:"
            unzip -Z1 "$APK" | grep -Ei '^assets/(touch|joystick|VirtualAnalog)' | head -n 200 || true
            echo
            echo "Steam/GDNative:"
            unzip -Z1 "$APK" | grep -Ei 'godotsteam|steamstub|Steam\.(gd|gdc|tscn)' | head -n 200 || true
          } >> "$WORK/logs/apk-summary.txt"

      - name: Extract original Android icon
        shell: bash
        run: |
          set -euo pipefail

          ICON=""
          for CANDIDATE in \
            res/mipmap-xxxhdpi-v4/icon.png \
            res/mipmap-xxhdpi-v4/icon.png \
            res/mipmap-xhdpi-v4/icon.png \
            res/mipmap-hdpi-v4/icon.png \
            res/mipmap-mdpi-v4/icon.png \
            res/mipmap/icon.png
          do
            if unzip -Z1 "$APK" | grep -Fxq "$CANDIDATE"; then
              unzip -p "$APK" "$CANDIDATE" > "$WORK/icons/original.png"
              ICON="$CANDIDATE"
              break
            fi
          done

          if [ -z "$ICON" ]; then
            echo "::error::Original APK icon was not found."
            exit 1
          fi

          echo "Using original icon: $ICON"
          file "$WORK/icons/original.png"

          cp "$WORK/icons/original.png" "$WORK/icons/icon-source.png"
          sips -s format png -z 120 120   "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-120.png"  >/dev/null
          sips -s format png -z 76 76     "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-76.png"   >/dev/null
          sips -s format png -z 1024 1024 "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-1024.png" >/dev/null
          sips -s format png -z 180 180 "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-180.png" >/dev/null
          sips -s format png -z 152 152 "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-152.png" >/dev/null
          sips -s format png -z 167 167 "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-167.png" >/dev/null
          sips -s format png -z 40 40   "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-40.png"  >/dev/null
          sips -s format png -z 80 80   "$WORK/icons/icon-source.png" --out "$WORK/icons/icon-80.png"  >/dev/null

      - name: Download Godot RE Tools
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/GDRETools/gdsdecomp/releases/download/v${GDRE_VERSION}/GDRE_tools-v${GDRE_VERSION}-macos.zip"
          curl --fail --location --retry 4 "$URL" -o "$WORK/gdre.zip"
          mkdir -p "$WORK/gdre"
          ditto -x -k "$WORK/gdre.zip" "$WORK/gdre"
          xattr -dr com.apple.quarantine "$WORK/gdre" 2>/dev/null || true

          echo "GDRE archive contents:"
          find "$WORK/gdre" -maxdepth 5 -type f | head -n 80

          GDRE="$(
            find "$WORK/gdre" -type f \( -name 'gdre_tools' -o -name 'GDRE Tools' -o -name 'GDRE_tools' \) \
              | head -n 1
          )"

          if [ -z "$GDRE" ]; then
            GDRE="$(find "$WORK/gdre" -path '*/Contents/MacOS/*' -type f | head -n 1 || true)"
          fi

          if [ -z "$GDRE" ]; then
            echo "::error::Could not locate GDRE Tools executable."
            exit 1
          fi

          chmod +x "$GDRE"
          echo "GDRE=$GDRE" >> "$GITHUB_ENV"
          "$GDRE" --version 2>&1 | tee "$WORK/logs/gdre-version.txt" || true

      - name: Recover the Godot project from APK
        shell: bash
        run: |
          set +e

          "$GDRE" \
            --headless \
            --recover="$APK" \
            --output-dir="$PROJECT" \
            --ignore-checksum-errors \
            2>&1 | tee "$WORK/logs/gdre-recovery.log"

          RC=${PIPESTATUS[0]}
          echo "GDRE_EXIT_CODE=$RC" | tee -a "$WORK/logs/gdre-recovery.log"

          if [ ! -f "$PROJECT/project.godot" ]; then
            FOUND="$(find "$PROJECT" -type f -name project.godot -print -quit || true)"
            if [ -n "$FOUND" ]; then
              REAL_PROJECT="$(dirname "$FOUND")"
              echo "Recovered project is nested at: $REAL_PROJECT"
              echo "PROJECT=$REAL_PROJECT" >> "$GITHUB_ENV"
            fi
          fi

          exit 0

      - name: Validate recovered project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT/project.godot" ]; then
            echo "::error::GDRE did not produce project.godot."
            echo "Top recovered files:"
            find "$WORK/project" -maxdepth 3 -type f | head -n 200 || true
            exit 1
          fi

          echo "Recovered project: $PROJECT"
          echo "GDScript source count: $(find "$PROJECT" -type f -name '*.gd' | wc -l | tr -d ' ')"
          echo "Scene count: $(find "$PROJECT" -type f \( -name '*.tscn' -o -name '*.scn' \) | wc -l | tr -d ' ')"

          grep -nE 'application/config/name|application/run/main_scene|autoload/|rendering/quality/driver|display/window/handheld/orientation' \
            "$PROJECT/project.godot" \
            | tee "$WORK/logs/project-important-settings.txt" || true

      - name: Prepare recovered project for iOS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT/ios_icon"

          cp "$WORK/icons/original.png"  "$PROJECT/ios_icon/original.png"
          cp "$WORK/icons/icon-120.png"  "$PROJECT/ios_icon/icon-120.png"
          cp "$WORK/icons/icon-76.png"   "$PROJECT/ios_icon/icon-76.png"
          cp "$WORK/icons/icon-1024.png" "$PROJECT/ios_icon/icon-1024.png"
          cp "$WORK/icons/icon-180.png"  "$PROJECT/ios_icon/icon-180.png"
          cp "$WORK/icons/icon-152.png"  "$PROJECT/ios_icon/icon-152.png"
          cp "$WORK/icons/icon-167.png"  "$PROJECT/ios_icon/icon-167.png"
          cp "$WORK/icons/icon-40.png"   "$PROJECT/ios_icon/icon-40.png"
          cp "$WORK/icons/icon-80.png"   "$PROJECT/ios_icon/icon-80.png"

          python3 - <<'PY'
          import os, re, pathlib

          project = pathlib.Path(os.environ["PROJECT"]) / "project.godot"
          text = project.read_text(errors="replace")

          text = re.sub(
              r'(?ms)(^\[editor_plugins\]\s*.*?)(?=^\[|\Z)',
              '[editor_plugins]\nenabled=PoolStringArray( )\n\n',
              text
          )

          if 'application/config/icon=' in text:
              text = re.sub(
                  r'(?m)^application/config/icon=.*$',
                  'application/config/icon="res://ios_icon/original.png"',
                  text
              )
          else:
              m = re.search(r'(?m)^\[application\]\s*$', text)
              if m:
                  insert = m.end()
                  text = text[:insert] + '\napplication/config/icon="res://ios_icon/original.png"' + text[insert:]

          # Godot 3.x GLES2 iOS export requires PVRTC texture variants.
          # v1.6 diagnostics failed specifically because this setting was absent.
          section = re.search(r'(?m)^\[rendering\]\s*$', text)
          pvrtc_line = 'vram_compression/import_pvrtc=true'

          if re.search(r'(?m)^vram_compression/import_pvrtc=', text):
              text = re.sub(
                  r'(?m)^vram_compression/import_pvrtc=.*$',
                  pvrtc_line,
                  text
              )
          elif section:
              pos = section.end()
              text = text[:pos] + '\n' + pvrtc_line + text[pos:]
          else:
              text += '\n\n[rendering]\n' + pvrtc_line + '\n'

          # v1.8: iOS GLES2 forward-movement / exploding-triangle fix.
          #
          # The symptom on-device is geometry stretching into giant black polygons
          # only while moving forward. Godot 3.x had several iOS GLES2 issues around
          # half-float vertex data / mesh compression and hardware skinning.
          # Force the safest path for iPhone here:
          ios_render_settings = {
              # v1.9: move the iPhone build off the GLES2 path entirely.
              # The remaining artifact is angle/movement dependent giant black geometry.
              # GLES3 uses a different vertex/render path on iOS and avoids the GLES2
              # half-float/split-stream path that has already been problematic.
              'quality/driver/driver_name': '"GLES3"',
              'quality/driver/fallback_to_gles2': 'false',

              # Keep the conservative mesh settings from v1.8 too.
              'gles2/compatibility/disable_half_float': 'true',
              'gles2/compatibility/disable_half_float.iOS': 'true',
              'misc/mesh_storage/split_stream': 'false',
              'quality/skinning/force_software_skinning': 'true',
              'threads/thread_safe_bvh': 'true',
              'threads/thread_model': '1',
          }

          # Ensure there is exactly one [rendering] section.
          m_render = re.search(r'(?m)^\[rendering\]\s*$', text)
          if not m_render:
              text += '\n\n[rendering]\n'
              m_render = re.search(r'(?m)^\[rendering\]\s*$', text)

          for key, value in ios_render_settings.items():
              pat = r'(?m)^' + re.escape(key) + r'=.*$'
              line = key + '=' + value
              if re.search(pat, text):
                  text = re.sub(pat, line, text)
              else:
                  pos = m_render.end()
                  text = text[:pos] + '\n' + line + text[pos:]
                  m_render = re.search(r'(?m)^\[rendering\]\s*$', text)

          project.write_text(text)
          PY

          echo "===== iOS RENDERER COMPATIBILITY SETTINGS ====="
          grep -nE 'quality/driver/driver_name|quality/driver/fallback_to_gles2|vram_compression/import_(etc|etc2|pvrtc|s3tc)|gles2/compatibility/disable_half_float|misc/mesh_storage/split_stream|quality/skinning/force_software_skinning|threads/thread_safe_bvh|threads/thread_model'             "$PROJECT/project.godot"             | tee "$WORK/logs/ios-renderer-settings-v1.9.txt" || true

          # Recovered Android imports only contain Android-friendly texture variants.
          # Delete the generated cache so Godot regenerates textures with PVRTC.
          rm -rf "$PROJECT/.import" || true
          mkdir -p "$PROJECT/.import"

          find "$PROJECT" -type f \( -name '*.apk' -o -name '*.aar' \) -delete || true
          find "$PROJECT" -type f -name '*.so' \
            ! -path '*/addons/godotsteam/*' \
            -delete || true

          cat > "$PROJECT/override.cfg" <<'OVERRIDE'
          [rendering]

          quality/driver/driver_name="GLES3"
          quality/driver/fallback_to_gles2=false
          gles2/compatibility/disable_half_float=true
          gles2/compatibility/disable_half_float.iOS=true
          misc/mesh_storage/split_stream=false
          quality/skinning/force_software_skinning=true
          threads/thread_safe_bvh=true
          threads/thread_model=1
          OVERRIDE

          echo "===== override.cfg ====="
          cat "$PROJECT/override.cfg" | tee "$WORK/logs/override-v1.9.txt"

          echo "Steam references kept for runtime compatibility/stub detection:"
          grep -RniE 'Steam|godotsteam|steamstub' "$PROJECT" \
            --include='*.gd' --include='*.gdnlib' --include='*.gdns' \
            | head -n 250 \
            | tee "$WORK/logs/steam-references.txt" || true

      - name: Create iOS export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > "$PROJECT/export_presets.cfg" <<'CFG'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patch_list=PoolStringArray( )
          script_export_mode=1
          script_encryption_key=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          application/app_store_team_id="AAAAAAAAAA"
          application/provisioning_profile_uuid_debug=""
          application/code_sign_identity_debug="iPhone Developer"
          application/export_method_debug=1
          application/provisioning_profile_uuid_release=""
          application/code_sign_identity_release="iPhone Distribution"
          application/export_method_release=0
          application/name="Cruelty Squad"
          application/info="Cruelty Squad"
          application/identifier="com.negel.crueltysquad"
          application/signature="CRSQ"
          application/short_version="2.5"
          application/version="2.5"
          application/copyright=""
          capabilities/arkit=false
          capabilities/camera=false
          capabilities/access_wifi=false
          capabilities/game_center=false
          capabilities/in_app_purchases=false
          capabilities/push_notifications=false
          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false
          privacy/camera_usage_description=""
          privacy/microphone_usage_description=""
          privacy/photolibrary_usage_description=""
          orientation/portrait=false
          orientation/landscape_left=true
          orientation/landscape_right=true
          orientation/portrait_upside_down=false
          required_icons/iphone_120x120="res://ios_icon/icon-120.png"
          required_icons/ipad_76x76="res://ios_icon/icon-76.png"
          required_icons/app_store_1024x1024="res://ios_icon/icon-1024.png"
          optional_icons/iphone_180x180="res://ios_icon/icon-180.png"
          optional_icons/ipad_152x152="res://ios_icon/icon-152.png"
          optional_icons/ipad_167x167="res://ios_icon/icon-167.png"
          optional_icons/spotlight_40x40="res://ios_icon/icon-40.png"
          optional_icons/spotlight_80x80="res://ios_icon/icon-80.png"
          storyboard/use_launch_screen_storyboard=false
          storyboard/image_scale_mode=0
          storyboard/custom_image@2x=""
          storyboard/custom_image@3x=""
          storyboard/use_custom_bg_color=false
          storyboard/custom_bg_color=Color( 0, 0, 0, 1 )
          landscape_launch_screens/iphone_2436x1125=""
          landscape_launch_screens/iphone_2208x1242=""
          landscape_launch_screens/ipad_1024x768=""
          landscape_launch_screens/ipad_2048x1536=""
          portrait_launch_screens/iphone_640x960=""
          portrait_launch_screens/iphone_640x1136=""
          portrait_launch_screens/iphone_750x1334=""
          portrait_launch_screens/iphone_1125x2436=""
          portrait_launch_screens/ipad_768x1024=""
          portrait_launch_screens/ipad_1536x2048=""
          portrait_launch_screens/iphone_1242x2208=""
          architectures/armv7=false
          architectures/arm64=true
          CFG

          sed -n '1,220p' "$PROJECT/export_presets.cfg" \
            | tee "$WORK/logs/export-preset.txt"

      - name: Download Godot 3.5.3 and iOS export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_osx.universal.zip"
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          curl --fail --location --retry 4 "$GODOT_URL" -o "$WORK/godot.zip"
          curl --fail --location --retry 4 "$TEMPLATE_URL" -o "$WORK/templates.tpz"

          mkdir -p "$WORK/godot" "$WORK/templates-unpack"
          ditto -x -k "$WORK/godot.zip" "$WORK/godot"
          unzip -q "$WORK/templates.tpz" -d "$WORK/templates-unpack"

          GODOT="$(find "$WORK/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -n 1)"
          if [ -z "$GODOT" ]; then
            echo "::error::Godot executable not found."
            exit 1
          fi

          chmod +x "$GODOT"
          xattr -dr com.apple.quarantine "$WORK/godot" 2>/dev/null || true
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/templates/${GODOT_VERSION}.stable"
          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          if [ -d "$WORK/templates-unpack/templates" ]; then
            cp -R "$WORK/templates-unpack/templates/." "$TEMPLATE_DIR/"
          else
            cp -R "$WORK/templates-unpack/." "$TEMPLATE_DIR/"
          fi

          echo "Godot:"
          "$GODOT" --version
          echo "iOS template candidates:"
          find "$TEMPLATE_DIR" -maxdepth 2 -type f | grep -Ei 'iphone|ios' | head -n 80 || true

      - name: Prepare Xcode for Godot iOS export
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | tee "$WORK/logs/xcode-sdks.txt"
          sudo xcodebuild -license accept >/dev/null 2>&1 || true
          sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true

          mkdir -p "$IOS_OUT"

      - name: Auto-detect known Godot iOS render blockers
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$WORK/logs/auto-triage-v1.9.txt"
          : > "$REPORT"

          echo "Cruelty Squad iOS v1.9 automatic triage" | tee -a "$REPORT"

          if grep -q 'quality/driver/driver_name="GLES3"' "$PROJECT/project.godot"; then
            echo "[OK] GLES3 forced for iOS." | tee -a "$REPORT"
          else
            echo "[FIX] GLES3 was missing; forcing it now." | tee -a "$REPORT"
            cat >> "$PROJECT/override.cfg" <<'EOF'
          quality/driver/driver_name="GLES3"
          quality/driver/fallback_to_gles2=false
          EOF
          fi

          if grep -q 'vram_compression/import_pvrtc=true' "$PROJECT/project.godot"; then
            echo "[OK] PVRTC import enabled." | tee -a "$REPORT"
          else
            echo "[WARN] PVRTC line missing." | tee -a "$REPORT"
          fi

          if grep -q 'quality/skinning/force_software_skinning=true' "$PROJECT/override.cfg"; then
            echo "[OK] Software skinning forced." | tee -a "$REPORT"
          fi

          if grep -q 'misc/mesh_storage/split_stream=false' "$PROJECT/override.cfg"; then
            echo "[OK] Split-stream disabled." | tee -a "$REPORT"
          fi

          echo "[NOTE] GitHub can auto-fix known config/build issues from logs."
          echo "[NOTE] Pure visual bugs still need a screenshot/video from the iPhone."
          cat "$REPORT"

      - name: Reimport project with iOS PVRTC textures
        shell: bash
        run: |
          set +e

          echo "Reimporting recovered project with PVRTC enabled..."
          "$GODOT" \
            --verbose \
            --path "$PROJECT" \
            --no-window \
            --editor \
            --quit \
            2>&1 | tee "$WORK/logs/godot-import.log"

          RC=${PIPESTATUS[0]}
          echo "GODOT_IMPORT_EXIT_CODE=$RC" | tee -a "$WORK/logs/godot-import.log"

          echo "===== PVRTC IMPORT CHECK ====="
          find "$PROJECT/.import" -type f 2>/dev/null \
            | grep -Ei 'pvrtc|\.stex$' \
            | head -n 200 \
            | tee "$WORK/logs/pvrtc-import-files.txt" || true

          grep -nEi -A 5 -B 3             'PVRTC|error|failed|failure|unrecognized binary resource|gdnative|godotsteam|qodot'             "$WORK/logs/godot-import.log"             | tail -n 350             | tee "$WORK/logs/godot-import-important.txt" || true

          # Native qodot/godotsteam warnings are known from the Android project
          # and are not themselves the iOS export blocker. Fail only if Godot
          # itself returned non-zero.
          exit "$RC"

      - name: Export Godot iOS Xcode project
        id: godot_export
        shell: bash
        run: |
          set +e

          rm -rf "$IOS_OUT"
          mkdir -p "$IOS_OUT"

          echo "===== GODOT iOS EXPORT ====="
          echo "Godot: $($GODOT --version 2>/dev/null)"
          echo "Project: $PROJECT"
          echo "Destination: $IOS_ZIP"

          "$GODOT" \
            --verbose \
            --path "$PROJECT" \
            --no-window \
            --export "iOS" "$IOS_ZIP" \
            2>&1 | tee "$WORK/logs/godot-ios-export.log"

          RC=${PIPESTATUS[0]}
          echo "GODOT_EXPORT_EXIT_CODE=$RC" | tee -a "$WORK/logs/godot-ios-export.log"

          echo "===== EXPORT OUTPUTS ====="
          find "$IOS_OUT" "$WORK" -maxdepth 6 \
            \( -type f -o -type d \) \
            \( -name '*.zip' -o -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name '*.pck' \) \
            -print 2>/dev/null | tee "$WORK/logs/ios-export-files.txt" || true

          echo "===== LAST 250 EXPORT LOG LINES ====="
          tail -n 250 "$WORK/logs/godot-ios-export.log" || true

          if [ "$RC" -ne 0 ]; then
            echo "::error::Godot iOS export failed with exit code $RC."
            grep -nEi -A 10 -B 6               'Cannot export project|Target platform requires|PVRTC|error|failed|failure|gdnative|godotsteam|qodot'               "$WORK/logs/godot-ios-export.log"               | tail -n 450 || true
            exit "$RC"
          fi

          if [ ! -f "$IOS_ZIP" ] && ! find "$IOS_OUT" "$WORK" -type d -name '*.xcodeproj' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Godot returned success but produced no iOS ZIP/Xcode project."
            exit 2
          fi

          exit 0

      - name: Locate and inspect Godot iOS export
        id: inspect_ios
        shell: bash
        run: |
          set +e

          rm -rf "$WORK/ios-export"
          mkdir -p "$WORK/ios-export"

          ZIP=""
          if [ -f "$IOS_ZIP" ]; then
            ZIP="$IOS_ZIP"
          else
            ZIP="$(find "$IOS_OUT" "$WORK" -maxdepth 6 -type f -name '*.zip' -print -quit 2>/dev/null || true)"
          fi

          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Found iOS ZIP: $ZIP"
            ls -lh "$ZIP"
            ditto -x -k "$ZIP" "$WORK/ios-export" 2>&1 | tee "$WORK/logs/ios-unpack.log"
          else
            echo "No iOS ZIP found. Looking for a directly-created Xcode project..."
          fi

          XCPROJ="$(find "$WORK/ios-export" "$IOS_OUT" "$WORK" \
            -type d -name '*.xcodeproj' -print -quit 2>/dev/null || true)"

          if [ -z "$XCPROJ" ]; then
            echo "::error::Godot produced neither a ZIP nor an Xcode project."
            echo "===== IMPORTANT GODOT EXPORT ERRORS ====="
            grep -nEi -A 8 -B 5 \
              'error|failed|failure|invalid|missing|template|gdnative|native.?script|steam|xcode|iphone|ios' \
              "$WORK/logs/godot-ios-export.log" 2>/dev/null \
              | tail -n 350 || true
            echo "===== FULL LOG TAIL ====="
            tail -n 350 "$WORK/logs/godot-ios-export.log" || true
            echo "XCODE_READY=false" >> "$GITHUB_ENV"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "XCPROJ=$XCPROJ" >> "$GITHUB_ENV"
          echo "XCODE_READY=true" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "xcodeproj=$XCPROJ" >> "$GITHUB_OUTPUT"
          echo "Xcode project: $XCPROJ"

          xcodebuild -project "$XCPROJ" -list -json \
            2>&1 | tee "$WORK/logs/xcode-project-list.json" || true

          exit 0

      - name: Build unsigned iOS app
        id: xcode_build
        shell: bash
        run: |
          set +e

          # Do NOT depend on a GitHub Actions output/if expression here.
          # The previous step already proved an Xcode project exists.
          # Rediscover it directly from disk and build it unconditionally.
          XCPROJ="$(find "$WORK/ios-export" "$IOS_OUT" "$WORK" \
            -type d -name '*.xcodeproj' -print -quit 2>/dev/null || true)"

          if [ -z "$XCPROJ" ]; then
            echo "::error::Xcode project disappeared before build."
            find "$WORK" -maxdepth 7 -type d -name '*.xcodeproj' -print || true
            exit 2
          fi

          echo "Building Xcode project: $XCPROJ"
          echo "XCPROJ=$XCPROJ" >> "$GITHUB_ENV"

          INFO="$(xcodebuild -project "$XCPROJ" -list -json 2>&1)"
          printf '%s\n' "$INFO" | tee "$WORK/logs/xcode-project-list-build.json"

          SCHEME="$(printf '%s' "$INFO" | python3 -c 'import sys,json; d=json.load(sys.stdin); a=d.get("project",{}).get("schemes",[]); print(a[0] if a else "")' 2>/dev/null)"
          TARGET="$(printf '%s' "$INFO" | python3 -c 'import sys,json; d=json.load(sys.stdin); a=d.get("project",{}).get("targets",[]); print(a[0] if a else "")' 2>/dev/null)"

          echo "Scheme: ${SCHEME:-<none>}"
          echo "Target: ${TARGET:-<none>}"

          if [ -n "$SCHEME" ]; then
            SELECTOR=(-scheme "$SCHEME")
          elif [ -n "$TARGET" ]; then
            SELECTOR=(-target "$TARGET")
          else
            echo "::error::Could not determine Xcode scheme or target."
            exit 3
          fi

          rm -rf "$WORK/products" "$WORK/DerivedData"
          mkdir -p "$WORK/products"

          xcodebuild \
            -project "$XCPROJ" \
            "${SELECTOR[@]}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$WORK/DerivedData" \
            CONFIGURATION_BUILD_DIR="$WORK/products" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            build \
            2>&1 | tee "$WORK/logs/xcodebuild.log"

          RC=${PIPESTATUS[0]}
          echo "XCODEBUILD_EXIT_CODE=$RC" | tee -a "$WORK/logs/xcodebuild.log"
          exit "$RC"

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail

          # Package whatever device .app Xcode produced.
          APP="$(find "$WORK/products" "$WORK/DerivedData/Build/Products" \
            -type d -name '*.app' \
            ! -path '*Simulator*' \
            | head -n 1 || true)"

          if [ -z "$APP" ]; then
            echo "::error::No device .app was produced."
            echo "Xcode build outcome: ${{ steps.xcode_build.outcome }}"
            tail -n 250 "$WORK/logs/xcodebuild.log" 2>/dev/null || true
            exit 1
          fi

          echo "APP=$APP"
          du -sh "$APP"

          rm -rf "$WORK/Payload"
          mkdir -p "$WORK/Payload"
          ditto "$APP" "$WORK/Payload/$(basename "$APP")"

          rm -f "$IPA"
          (
            cd "$WORK"
            zip -qry "$IPA" Payload
          )

          echo "Unsigned IPA:"
          ls -lh "$IPA"

          cp "$WORK/icons/original.png" "$GITHUB_WORKSPACE/Cruelty-Squad-original-icon.png"

      - name: Collect diagnostics
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/Cruelty-Squad-iOS-v1.9-Diagnostics"
          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          cp "$WORK/logs/godot-ios-export.log" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/godot-import.log" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/gdre-recovery.log" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/apk-summary.txt" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/project-important-settings.txt" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/export-preset.txt" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/xcode-project-list.json" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/xcode-project-list-build.json" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/xcodebuild.log" "$DIAG/" 2>/dev/null || true
          cp "$PROJECT/project.godot" "$DIAG/project.godot" 2>/dev/null || true
          cp "$PROJECT/export_presets.cfg" "$DIAG/export_presets.cfg" 2>/dev/null || true
          cp "$PROJECT/override.cfg" "$DIAG/override.cfg" 2>/dev/null || true
          cp "$WORK/logs/ios-renderer-settings-v1.9.txt" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/override-v1.9.txt" "$DIAG/" 2>/dev/null || true
          cp "$WORK/logs/auto-triage-v1.9.txt" "$DIAG/" 2>/dev/null || true
          cp "$WORK/icons/original.png" "$DIAG/original-apk-icon.png" 2>/dev/null || true

          {
            echo "=== APK ==="
            ls -lh "$APK" 2>/dev/null || true
            echo
            echo "=== GODOT ==="
            "$GODOT" --version 2>/dev/null || true
            echo
            echo "=== XCODE SELECT ==="
            xcode-select -p 2>/dev/null || true
            xcodebuild -version 2>/dev/null || true
            echo
            echo "=== EXPORT FILES ==="
            find "$IOS_OUT" "$WORK/ios-export" -maxdepth 6 \
              \( -name '*.zip' -o -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name '*.pck' \) \
              -print 2>/dev/null || true
            echo
            echo "=== IPA ==="
            ls -lh "$IPA" 2>/dev/null || true
          } > "$DIAG/summary.txt"

          {
            echo "===== GODOT EXPORT ERROR CONTEXT ====="
            grep -nEi -A 8 -B 5 \
              'error|failed|failure|invalid|missing|template|gdnative|native.?script|steam|xcode|iphone|ios' \
              "$WORK/logs/godot-ios-export.log" 2>/dev/null \
              | tail -n 450 || true
            echo
            echo "===== GODOT EXPORT TAIL ====="
            tail -n 350 "$WORK/logs/godot-ios-export.log" 2>/dev/null || true
            echo
            echo "===== XCODEBUILD TAIL ====="
            tail -n 350 "$WORK/logs/xcodebuild.log" 2>/dev/null || true
          } > "$DIAG/important-errors.txt"

          cat "$DIAG/important-errors.txt" || true
          exit 0

      - name: Upload unsigned IPA
        if: hashFiles('Cruelty-Squad-iOS-v1.9-unsigned.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Cruelty-Squad-iOS-v1.9-unsigned-IPA
          path: |
            Cruelty-Squad-iOS-v1.9-unsigned.ipa
            Cruelty-Squad-original-icon.png
          compression-level: 0
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cruelty-Squad-iOS-v1.9-Diagnostics
          path: Cruelty-Squad-iOS-v1.9-Diagnostics
          compression-level: 0
          if-no-files-found: warn

      - name: Final result
        if: always()
        shell: bash
        run: |
          if [ -f "$IPA" ]; then
            echo "SUCCESS: Cruelty-Squad-iOS-v1.9-unsigned.ipa was created."
            exit 0
          fi

          echo "::error::IPA was not created. Download Cruelty-Squad-iOS-v1.9-Diagnostics and send it here."
          exit 1
